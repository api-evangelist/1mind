  base_url_note: >-
    No published base URL. The 1mind console's Content-Security-Policy names
    https://interaction.prd-b.1mind.com and https://interaction.prd-b.1mind.com/v1
    as connect-src origins, and that host is live and returns a structured JSON
    error envelope — but it is an internal environment name (prd-b) that 1mind
    documents nowhere, so it is recorded as an observation and NOT written into
    apis.yml as a baseURL. Guessing a production base from an internal CSP entry
    would be a fabrication.
  documented: false
  documentation_note: >-
    developer.1mind.com and docs.1mind.com are NOT developer portals. Both
    resolve to 35.190.54.50 and return the *.1mind.com wildcard SPA — the same
    body, byte for byte, that a subdomain which does not exist returns
    (zzzznotreal.1mind.com, md5 a9d9693c7bcd2cd0de1059dd13bb045e). docs.1mind.com
    additionally serves <meta name="robots" content="noindex">. The prior round's
    DeveloperPortal and Documentation pointers were removed from apis.yml on
    2026-08-13 because they credited 1mind with portals it does not serve.
