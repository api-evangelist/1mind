aid: 1mind
name: 1mind
description: 1mind is an AI-Led Growth (AILG) platform that deploys multimodal AI "Superhumans" — combining
  a face, a voice, and a go-to-market brain — for enterprise B2B revenue teams. Its Superhumans qualify
  leads, deliver demos, handle objections, book meetings, and onboard customers 24/7 across websites,
  in-product surfaces, live video calls, and deal rooms. Founded by Amanda Kahlow (former founder and
  CEO of 6sense), 1mind publicly launched in November 2025 with $40M in total funding (Series A led by
  Battery Ventures, with Wing Venture Capital, Primary Ventures, Operator Collective, Harmonic Growth
  Partners, and Success Venture Partners participating). Customers include HubSpot, Boston Dynamics, Seismic,
  New Relic, ZoomInfo, Coupa, Nutanix, and Tealium. The platform is the exclusive AI successor to Drift
  within the Clari + Salesloft Predictive Revenue System and operates a US-region REST API, backed by
  SOC 2 Type II, ISO 27001, and ISO 42001 certifications.
